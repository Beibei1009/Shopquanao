version: '3.8'

services:
  # PHP Apache Web Server
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jewelry_shop_web
    ports:
      - "8080:80"
    volumes:
      # Persist uploads để không mất ảnh khi restart
      - ./public/uploads:/var/www/html/public/uploads
      # Persist session để không bị đăng xuất
      - php_sessions:/var/lib/php/sessions
    environment:
      # Database connection sẽ dùng Neon PostgreSQL (cloud)
      - DB_HOST=ep-steep-bar-ade1yc2b-pooler.c-2.us-east-1.aws.neon.tech
      - DB_PORT=5432
      - DB_NAME=neondb
      - DB_USER=neondb_owner
      - DB_PASS=npg_pjz6VnLaMh4o
      - DB_SSL=require
    networks:
      - jewelry_network
    restart: unless-stopped

networks:
  jewelry_network:
    driver: bridge

volumes:
  php_sessions:
